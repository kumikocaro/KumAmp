name: Build

# Compila KumAmp en la nube: Windows (VST3 + Standalone + instalador .exe) y
# macOS Apple Silicon (VST3 + AU + Standalone). Los resultados quedan en la
# pestaña Actions -> el run -> "Artifacts".
on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build-win -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build-win --config Release --parallel

      - name: Test
        run: ctest --test-dir build-win -C Release --output-on-failure

      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $version = (Select-String -Path CMakeLists.txt -Pattern 'project\(KumAmp VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          & $iscc /DAppVersion=$version /DBuildDir="$PWD\build-win\KumAmp_artefacts\Release" installer\KumAmp.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: KumAmp-Windows-Installer
          path: dist/*.exe

      - uses: actions/upload-artifact@v4
        with:
          name: KumAmp-Windows-VST3
          path: build-win/KumAmp_artefacts/Release/VST3/

  macos:
    name: macOS Apple Silicon
    # macOS minutes cost 10x on private repos: only for manual runs and version tags.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DKUMAMP_COPY_AFTER_BUILD=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package
        run: |
          mkdir -p dist
          cd build/KumAmp_artefacts/Release
          ditto -c -k --keepParent VST3/KumAmp.vst3 ../../../dist/KumAmp-macOS-VST3.zip
          ditto -c -k --keepParent AU/KumAmp.component ../../../dist/KumAmp-macOS-AU.zip
          ditto -c -k --keepParent Standalone/KumAmp.app ../../../dist/KumAmp-macOS-Standalone.zip

      - uses: actions/upload-artifact@v4
        with:
          name: KumAmp-macOS
          path: dist/*.zip
